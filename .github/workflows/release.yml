name: Build and Release linux

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install git -y

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: seanmiddleditch/gha-setup-ninja@master


      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libx11-dev libxrandr-dev  libxinerama-dev libxcursor-dev xorg-dev -y


      - name: Build
        env:
          TARGET_PLATFORM: linux
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Platinum -S . -B build
          cmake --build build -j
          cmake --install build --prefix install
      - name: Zip
        run: |
          zip -r release_linux.zip install

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest_linux"
          prerelease: true
          files: |
            release_linux.zip
