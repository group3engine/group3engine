name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build
        env:
          TARGET_PLATFORM: windows
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Platinum -S . -B build
          cmake --build build -j
          cmake --install build --prefix install
      - name: Zip
        run: |
          Compress-Archive -Path install -DestinationPath release.zip
      - name: Datetime
        id: current_datetime
        run: echo "datetime=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "release-${{ steps.current_datetime.outputs.datetime }}"
          prerelease: true
          title: "AUTO RELEASE: ${{ steps.current_datetime.outputs.datetime }}"
          files: |
            release.zip
