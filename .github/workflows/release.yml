name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Build
        env:
          TARGET_PLATFORM: windows
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Platinum -S . -B build
          cmake --build build -j
          cmake --install build --prefix install
      - name: Zip
        run: |
          Compress-Archive -Path install -DestinationPath release_windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-release
          path: release_windows.zip

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Build
        env:
          TARGET_PLATFORM: linux
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Platinum -S . -B build
          cmake --build build -j
          cmake --install build --prefix install
      - name: Create Archive
        run: |
          tar -czvf release_linux.tar.gz install
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v3
        with:
          name: linux-release
          path: release_linux.tar.gz

  create_release:
    name: Create Release
    needs: [build_windows, build_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: windows-release
      - name: Download Linux Artifact
        uses: actions/download-artifact@v3
        with:
          name: linux-release
      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          files: |
            release_windows.zip
            release_linux.tar.gz